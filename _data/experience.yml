# Experience entries, newest first. Rendered by _includes/experience.html.
#
# id        anchor for the entry (/experience/#id)
# image     card image; .mp4/.webm render as a muted looping video. Optional.
# excerpt   one or two sentences shown on the closed card (HTML allowed)
# details   Markdown shown when the card is expanded
# links     buttons on the card: {label, url}
# projects  highlighted projects inside the expanded section:
#           {title, image, text (HTML allowed), links: [{label, url}]}
#           or, for a demo with playback controls: video + poster instead of image
#           (self-hosted MP4s in assets/videos/)

- id: dreamworks
  org: DreamWorks Animation
  role: Production Software Intern, Frontend Tools
  dates: Jun. 2026 – Aug. 2026
  location: Glendale, CA
  excerpt: >-
    Rendering R&amp;D for MoonRay and real-time graphics tools for layout artists, including
    tools released for <i>Shrek 5</i>.
  details: |
    - **Rendering R&D:** prototyped a lens-sampled auxiliary-ray depth of field (DoF) integrator
      in C++ for MoonRay, and built a dependency-free DoF test scene the team now uses. Presented
      an energy-loss and correlation analysis to the MoonRay team.
    - **Graphics tools:** built real-time OpenGL/Maya DoF previews with the Layout leads,
      replacing overnight render checks with live, Nuke-matched focus, f-stop, and frustum
      controls. Shipped to **20+ artists** on **2 shows**.
    - **Production pipeline:** updated Rez and SCons dependencies for 2027 DCC versions and VFX
      Reference Platform parity, releasing layout tools for *Shrek 5* and future shows. Built a
      standardized camera rotation-order system for downstream consistency, and a zsh
      compatibility layer over the studio's tcsh environment, now documented in the knowledge
      base and shared with studio tech leads.
  projects:
    - title: Auxiliary-ray DoF integrator
      text: Lens-sampled depth of field prototype for MoonRay, in C++.
    - title: Live DoF previews
      text: Real-time OpenGL/Maya depth of field matched to Nuke, used by 20+ layout artists.

