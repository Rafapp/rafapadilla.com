    Shipped Python and C++ pipeline tools for <i>Hexed</i> and <i>Zootopia 2</i> across lighting,
    visdev, grooming, and modeling.
  details: |
    - **Production pipeline:** built version and dependency tracking for the Lighting-in-Assets
