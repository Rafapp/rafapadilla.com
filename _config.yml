title: Rafael Padilla
subtitle: Graphics & Software Engineer
email: rpadiper@gmail.com
logo: /assets/images/rafa_pfp.jpeg
description: >-
  Rafael Padilla is a graphics and software engineer working on rendering, GPU path tracing,
  and production tools for animation, with experience at DreamWorks Animation and Walt Disney
  Animation Studios.
url: "https://rafapadilla.com" # absolute URLs for canonical links, Open Graph and the sitemap
locale: "en-US"
title_separator: "|"
og_image: /assets/images/headshot.jpeg
# google_site_verification: "" # paste the token from Google Search Console
# Structured data (_includes/schema.html)
social:
  name: "Rafael Padilla"
  alternate_names: ["Rafael Padilla Perez", "Rafa Padilla"]
  links:
    - "https://github.com/Rafapp"
    - "https://www.linkedin.com/in/rafaelpadillaperez/"
twitter_username: rafagamedev
github_username: rafapp
# Palette: Cornell box, see _sass/minimal-mistakes/skins/_neon.scss
minimal_mistakes_skin: neon
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.26.1
# Outputting
permalink: /:categories/:title/
paginate: 5 # posts on the home page
paginate_path: /page:num/
timezone: PST # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from the build. Setting this replaces Jekyll's defaults, so they're repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - README.md
  # Local-only files (also in .git/info/exclude): agent notes, plans, sources
  - CLAUDE.md
  - layout.md
  - graphify-out
  - ResumeRafaelPadillaPerez.pdf
  - assets/images/cornell/cornell-wide.png
  - assets/images/cornell/cornell-tall.png

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

author:
  name   : "Rafael Padilla"
  avatar : "/assets/images/headshot.jpeg"
  bio    : "Graphics & Software Engineer"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Rafapp"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/rafaelpadillaperez/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Rafapp"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/rafaelpadillaperez/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      classes: wide
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
